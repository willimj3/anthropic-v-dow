- title: "Pentagon's Anthropic Designation Won't Survive First Contact with Legal System"
  authors: [Michael Endrias, Alan Z. Rozenshtein]
  publication: Lawfare
  date: 2026-03-02
  tag: analysis
  url: https://www.lawfaremedia.org/article/pentagon's-anthropic-designation-won't-survive-first-contact-with-legal-system
  summary: |
    The first major academic broadside against the supply-chain risk theory. Identifies
    multiple independent grounds for relief: statutory text, the Webster v. Doe
    constitutional carveout, Department of Commerce v. New York pretext, FAR 9.402(b)
    (debarment limited to public-interest purposes, not punishment), and the Luokung /
    Xiaomi analogies. This piece set the analytical frame the litigation now operates within.

- title: "What the Defense Production Act Can and Can't Do to Anthropic"
  authors: [Alan Z. Rozenshtein]
  publication: Lawfare
  date: 2026-02-25
  tag: analysis
  url: https://www.lawfaremedia.org/article/what-the-defense-production-act-can-and-can't-do-to-anthropic
  summary: |
    Argues that the DPA threat earlier in the week was equally legally infirm — the
    statute has never been used to compel a company to produce a product it has deemed
    unsafe.

- title: "The War on Anthropic: Pretextual Designation and Unlawful Punishment"
  authors: [Harold Hongju Koh, Bruce Swartz, Avi Gupta, Brady Worthington]
  publication: Just Security
  date: 2026-03-06
  tag: analysis
  url: https://www.justsecurity.org/133247/anthropic-hegseth-unlawful-punishment/
  summary: |
    Raises a Bill of Attainder theory not pleaded in Anthropic's complaint. Argues the
    designation singles out Anthropic by name and imposes punishment without judicial
    process, satisfying both prongs of the modern attainder test. Koh subsequently
    appeared as pro hac counsel for the Former Senior National Security Government
    Officials amicus group.

- title: "D.C. Circuit Declines to Stay Department of War's 'Supply-Chain Risk' Designation of Claude"
  authors: [Eugene Volokh]
  publication: Volokh Conspiracy (Reason)
  date: 2026-04-08
  tag: news
  url: https://reason.com/volokh/2026/04/08/d-c-circuit-declines-to-stay-department-of-wars-supply-chain-risk-designation-of-claude/

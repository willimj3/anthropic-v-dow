- title: "Microsoft amicus brief (in support of Anthropic)"
  publication: N.D. Cal. and D.C. Cir.
  date: 2026-03-10
  tag: brief
  url: https://thehill.com/policy/technology/5777742-microsoft-backs-anthropic-ai-case/
  summary: |
    Microsoft argues that the supply-chain risk framework is unworkable if it can be

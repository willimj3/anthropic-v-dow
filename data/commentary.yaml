    entire federal cloud-and-AI procurement ecosystem.

- title: "ACLU + CDT amicus brief"
  publication: D.C. Cir.
  date: 2026-03-16
  tag: brief
  url: https://www.aclu.org/documents/anthropic-amicus
  summary: |
    Civil-liberties framing of the First Amendment retaliation theory, with emphasis

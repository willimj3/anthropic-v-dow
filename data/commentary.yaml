- title: "Two Courts, Two Postures: What the DC Circuit's Stay Denial Means for the Anthropic-Pentagon Dispute"
  publication: Jones Walker AI Law Blog
  date: 2026-04-22
  tag: analysis
  url: https://www.joneswalker.com/en/insights/blogs/ai-law-blog/two-courts-two-postures-what-the-dc-circuits-stay-denial-means-for-the-anthrop.html
  summary: |
    Practitioner explainer of why the D.C. Cir.'s stay denial does not undermine
    Judge Lin's PI. The two proceedings address different statutes and different
    government actions; coexistence is doctrinally normal.


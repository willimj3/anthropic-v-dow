- title: "Of Free Speech Claims and Supply Chain Risks: Anthropic's Battle with the Government"
  authors: [AEI staff]
  publication: American Enterprise Institute
  date: 2026-04-14
  tag: analysis
  url: https://www.aei.org/technology-and-innovation/of-free-speech-claims-and-supply-chain-risks-anthropics-battle-with-the-government/

- title: "Cato Institute amicus brief"
  publication: N.D. Cal.
  date: 2026-03-12
  tag: brief
  url: https://www.cato.org/legal-briefs/anthropic-v-department-war
  summary: |
    Argues that AI model design constitutes First Amendment-protected expression and
    that compelling Anthropic to alter Claude's guardrails would be classic compelled
    speech. (Filed jointly with FIRE, EFF, Chamber of Progress, and FALA.)

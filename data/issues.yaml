- slug: apa-supply-chain
  title: APA — Supply Chain Designation (10 U.S.C. § 3252)
  doctrinal_framework: |
    APA § 706(2)(A), (C), (D). Statutory authority must come from the text of § 3252,
    which targets risk that an "adversary may sabotage, maliciously introduce unwanted
    function, or otherwise subvert" a covered system.

    Procedural requirements at § 3252(b)(2)(B) and (b)(3)(B) include a written
    determination that less intrusive measures are not reasonably available; 48 C.F.R.
    § 239.7304(a) requires risk assessment from the Under Secretary of Defense for
    Intelligence.
  status_at_pi: |
    Three independent APA problems found.

    (a) The designation falls outside the statute's text — government counsel could not
    identify record evidence that Anthropic has technical capability to alter or stop
    Claude in DoW environments after deployment.

    (b) Procedural defects — the six identical letters to congressional committees did
    not discuss less intrusive measures, and the assessment came from the wrong Under
    Secretary (Michael, who led contract negotiations).

    (c) Arbitrary and capricious / pretextual under Department of Commerce v. New York.
  open_questions: |
    Whether the major questions doctrine applies (Lawfare argument, drawing on the
    Roberts plurality in the SCOTUS IEEPA tariffs decision earlier in 2026).

    Whether the Acronis AG designation (Sept. 2025) is the only meaningful precedent
    and how much weight to give that.
  related_holdings: ['2026-03-26']
  related_claims: ['I']
  sources:

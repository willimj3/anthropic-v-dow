- slug: webster-doe-carveout
  title: Webster v. Doe and constitutional carveouts
  doctrinal_framework: |
    Webster v. Doe, 486 U.S. 592 (1988) — even broad statutory preclusion-of-review
    provisions are read not to preclude constitutional claims unless Congress clearly
    intends to do so.
  status_at_pi: |
    Lin did not need to reach the carveout because the government did not press the
    preclusion argument and the APA route was open. Available as a backstop should the
    government argue § 3252's reviewability bar extends to constitutional claims.
  open_questions: |
    Whether the principle extends to the FASCSA review framework in the D.C. Cir. case.
  sources:
    - kind: authority
      label: Webster v. Doe
      cite: 486 U.S. 592 (1988)

- slug: bill-of-attainder
  title: Bill of Attainder (Koh et al.)
  doctrinal_framework: |
    U.S. Const. art. I, §§ 9 cl. 3 and 10 cl. 1.

    Modern attainder test (Selective Service System v. Minnesota PIRG, 468 U.S. 841
    (1984); Nixon v. Administrator, 433 U.S. 425 (1977)) requires (1) specificity —
    singles out an identifiable person; and (2) punishment without judicial process.
  status_at_pi: |
    Not pleaded by Anthropic, but raised by Koh, Swartz, Gupta, and Worthington on
    Just Security (Mar. 6, 2026). Available as a potential amendment.
  open_questions: |
    Whether Anthropic adds a Bill of Attainder count on amendment, and how the modern
    attainder doctrine — rarely applied to corporate entities — would map to the facts.
  sources:
    - kind: article
      label: "The Anthropic Designation and the Bill of Attainder Doctrine (Just Security, Mar. 6, 2026)"
      url: https://www.justsecurity.org/
    - kind: authority
      label: Selective Service System v. Minnesota PIRG
      cite: 468 U.S. 841 (1984)
    - kind: authority
      label: Nixon v. Administrator
      cite: 433 U.S. 425 (1977)

- slug: pretext-doctrine
  title: Pretext under Department of Commerce v. New York
  doctrinal_framework: |
    Department of Commerce v. New York, 588 U.S. 752 (2019) — courts "are not required
    to exhibit a naiveté from which ordinary citizens are free." Even where an agency
    has statutory authority, courts must reject action where the stated rationale is a
    "contrived" pretext for the actual motive.
  status_at_pi: |
    Applied to the Supply Chain Designation. The "story" the record tells does not match
    the explanation given: Michael's same-day cordial emails to Amodei ("I think we are
    very close here") cannot be squared with his contemporaneous characterization of
    Anthropic as an "unacceptable national security threat"; Hegseth's days-earlier
    Defense Production Act threat treats Anthropic as essential and contradicts the
    "supply chain risk" framing.
  open_questions: |
    How the doctrine plays in the FASCSA case, where the record before the D.C. Cir. is
    narrower.

    Whether the OpenAI parallel deal further strengthens pretext on disparate treatment.
  related_holdings: ['2026-03-26']
  related_claims: ['I']
  sources:
    - kind: authority
      label: Department of Commerce v. New York
      cite: 588 U.S. 752 (2019)

      label: NRA v. Vullo
      cite: 602 U.S. 175 (2024)

- slug: due-process
  title: Fifth Amendment procedural due process
  doctrinal_framework: |
    Mathews v. Eldridge, 424 U.S. 319 (1976) — three-factor balancing of private interest,
    risk of erroneous deprivation, and government interest.

    Liberty interest in federal-contracting eligibility and reputation under Greene v.
    McElroy, 360 U.S. 474 (1959); Trifax Corp. v. District of Columbia, 314 F.3d 641
    (D.C. Cir. 2003); Old Dominion Dairy Prods. v. Sec'y of Defense, 631 F.2d 953
    (D.C. Cir. 1980).
  status_at_pi: |
    Likelihood of success found. Court rejected the government's argument that a
    "complete prohibition" of the right to engage in a calling is required; under the
    D.C. Circuit's "reputation plus" test, a "broad preclusion" that "seriously affect[s],
    if not destroy[s]" the company's ability to obtain contracts is sufficient.

    Court rejected the government's exigency theory based on contradictory record evidence
    (six-month transition plan; continued Claude use in Iran operations; days-earlier DPA
    threat treating Anthropic as essential).
  open_questions: |
    Whether § 3252's stripped-down procedure can ever satisfy Mathews when applied to a
    domestic, non-adversary contractor.

    Whether a more elaborate notice-and-comment process would change the outcome.
  related_holdings: ['2026-03-26']
  related_claims: ['III']
  sources:
    - kind: opinion
      label: "PI Opinion (Dkt. 134, N.D. Cal., Mar. 26, 2026)"
      local_path: source-docs/134-pi-opinion.txt

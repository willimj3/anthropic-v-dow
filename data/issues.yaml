- slug: fascsa-jurisdiction
  title: D.C. Cir. jurisdiction under 41 U.S.C. § 1327
  doctrinal_framework: |
    FASCSA (41 U.S.C. § 4713) — Federal Acquisition Supply Chain Security Act. Provides
    30 days' notice, opportunity to respond, interagency review, and direct judicial
    review in the D.C. Circuit under 41 U.S.C. § 1327 over "covered procurement actions."
  status_at_pi: |
    D.C. Cir. denied Anthropic's emergency stay in April 2026 (per curiam, Wilkins,
    Katsas, Rao); commentary reads denial as procedurally driven, not a merits signal.

    Panel pre-ordered three argument issues: § 1327 jurisdiction; whether the Notice
    "directs or takes" a covered procurement action; whether Anthropic can affect Claude's
    functioning after delivery.
  open_questions: |
    Whether jurisdiction over § 4713 actions extends to the form of action taken here.

    How the panel weighs the third issue, which echoes the factual question Judge Lin
    answered against the government on the § 3252 designation.
  related_holdings: ['2026-04-20', '2026-05-21']
  sources:
    - kind: order
      label: Per Curiam Order denying emergency stay (D.C. Cir., Apr. 20, 2026)
      url: https://www.courtlistener.com/docket/72380208/anthropic-pbc-v-united-states-department-of-war/
    - kind: order

      label: "PI Opinion (Dkt. 134, N.D. Cal., Mar. 26, 2026)"
      local_path: source-docs/134-pi-opinion.txt
      url: https://www.courtlistener.com/docket/72379655/134/anthropic-pbc-v-us-department-of-war/
    - kind: authority
      label: "Arizona Students' Ass'n v. Arizona Bd. of Regents"
      cite: 824 F.3d 858 (9th Cir. 2016)
    - kind: authority
      label: Hartman v. Moore

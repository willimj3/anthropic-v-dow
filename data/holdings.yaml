- date: 2026-04-20
  court: dccir
  panel: Wilkins, Katsas, Rao
  caption: Per curiam order denying motion for emergency stay
  bottom_line: |
    Anthropic's emergency stay motion denied per curiam. Decision is procedural rather
    than a merits signal. The FASCSA designation accordingly remains in some operational
    effect during the pendency of the petition, subject to Anthropic's parallel § 3252
    injunction in N.D. Cal.

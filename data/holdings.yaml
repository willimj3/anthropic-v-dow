- date: 2026-03-26
  court: ndcal
  judge: Rita F. Lin
  caption: Order granting motion for preliminary injunction
  docket_entries: [134, 135]
  bottom_line: |
    Preliminary injunction granted against all named Defendant Agencies and Secretary
    Hegseth. The order restores the status quo as of February 27, 2026, by enjoining
    the Presidential Directive, the Hegseth Directive's contractor blacklist, and the
    10 U.S.C. § 3252 Supply Chain Designation. The Hegseth Directive and Supply Chain
    Designation are also stayed under 5 U.S.C. § 705. Bond: $100. Seven-day administrative
    stay (expired April 2, 2026). EOP not enjoined for lack of record evidence of
    implementing action.
  theories:
    - issue: First Amendment retaliation
      issue_slug: first-amendment-retaliation
      result: Likelihood of success
    - issue: Fifth Amendment due process
      issue_slug: due-process
      result: Likelihood of success
    - issue: APA (§ 3252 — text, procedure, pretext)
      issue_slug: apa-supply-chain
      result: Likelihood of success
    - issue: Ultra vires (Presidential Directive)
      issue_slug: ultra-vires
      result: Not reached
  key_quotes:
    - quote: |
        Reading "supply chain risk" to reach a vendor's negotiating posture would make
        Section 3252's restrictions on the Secretary's discretion meaningless.
      page: ~
    - quote: |
        The Court is not required to "exhibit a naiveté from which ordinary citizens are
        free." (citing Dep't of Commerce v. New York)
      page: ~

name: Sync dockets from CourtListener

# Runs daily at 11:00 UTC (≈ 6am Central). Also runs manually via the
# "Run workflow" button on the Actions tab.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pyyaml requests

      - name: Sync docket YAMLs from CourtListener
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/sync_dockets.py

      - name: Did anything change?
        id: changes
        run: |
          if git diff --quiet -- data/dockets/; then
            echo "No new docket entries."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Build gate -------------------------------------------------------
      # Never push docket data that doesn't build. If `next build` fails on the
      # freshly-synced data, this step fails, the workflow goes red (GitHub
      # emails the repo owner), and nothing is committed — so a bad sync can
      # never reach main, break the Vercel deploy, and freeze the live site.
      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS deps
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build gate (must pass before we push)
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push (only after a green build)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dockets/
          summary=$(git diff --staged --stat data/dockets/ | tail -1)
          git commit -m "sync: docket update from CourtListener

          $summary"
          git push

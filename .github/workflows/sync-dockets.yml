name: Sync dockets from CourtListener

# Runs daily at 11:00 UTC (≈ 6am Central). Also runs manually via the
# "Run workflow" button on the Actions tab.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pyyaml requests

      - name: Sync docket YAMLs from CourtListener
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python3 scripts/sync_dockets.py

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dockets/
          if git diff --staged --quiet; then
            echo "No new docket entries."
            exit 0
          fi
          summary=$(git diff --staged --stat data/dockets/ | tail -1)
          git commit -m "sync: docket update from CourtListener

          $summary"
          git push
